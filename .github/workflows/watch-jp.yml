name: watch-jp

# 財務省の公式リストを6時間ごとに監視する。経産省は手動監視へ移行する。
# OFAC と分の位置をずらして、同じ concurrency グループでの待ちを減らす。
on:
  # Run the exact production path after changes to the MOF monitor itself,
  # instead of waiting for the next scheduled poll after a repair.
  push:
    branches: [main]
    paths:
      - '.github/workflows/watch-jp.yml'
      - '.github/actions/run-watch/action.yml'
      - 'src/mof*.py'
      - 'src/master.py'
      - 'src/integrity_legacy.py'
      - 'src/rebuild_status.py'
  schedule:
    - cron: "37 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sanctions-watch-commit
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/run-watch
        with:
          sources: mof
          slack-webhook: ${{ secrets.SLACK_WEBHOOK_URL }}

      # The entire failed candidate stays uncommitted. Only a review-only
      # list of source/party changes may be published.
      - name: 財務省の旧登録差分を要レビューに退避
        if: failure()
        continue-on-error: true
        run: python -m src.mof_legacy_review

      - name: 財務省の未承認変更候補を監査Artifactに保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mof-legacy-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/dashboard/mof_legacy_review.csv
          retention-days: 90
          if-no-files-found: ignore

      # The composite action fails closed on an invalid integrity audit.
      # Publish the failed attempt only, never the rejected candidate master.
      - name: 財務省の失敗時刻と実行URLを記録
        if: failure()
        run: python -m src.mof_failure
