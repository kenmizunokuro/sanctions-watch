name: watch-ofac

# OFAC は決まったスケジュール無しに随時追加・削除を行うため毎時。
# 17分にしているのは、毎時00分が GitHub 側で最も混んでスケジュール遅延・
# スキップが起きやすいため。
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/watch-ofac.yml'
      - 'src/watch.py'
      - 'src/ofac_pending.py'
      - 'src/ofac_alias_history.py'
      - 'data/review/approved_volta_alias_history_20261110.json'
      - '.github/scripts/apply-approved-volta-alias-history.sh'
      - 'src/dashboard.py'
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sanctions-watch-commit
  queue: max
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: ./.github/actions/run-watch
        with:
          sources: ofac
          slack-webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
