name: watch-un
on:
  push:
    branches: [main]
    paths: ['.github/workflows/watch-un.yml', 'src/un_*.py', 'src/fetch.py', 'src/source_audit.py', 'data/un/updates_archive_receipt.json']
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
  pull_request:
    paths: ['src/**', 'tests/**', 'apps_script/**', '.github/workflows/watch-un.yml', 'requirements*.txt']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pip install -r requirements.txt
      - name: Offline regression
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python -m tests.test_offline
          python -m tests.test_e2e
          python -m tests.test_mof_record_diff
          python -m tests.test_mof_re_review
          node --test tests/test_un_gas.cjs tests/test_un_watchdog.cjs tests/test_mofa_gas.cjs tests/test_mof_pending_gas.cjs tests/test_ofac_watchdog.cjs tests/test_ofac_watchdog_status.cjs
          node tests/test_crypto_dashboard.cjs
          git diff --check

  monitor:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: sanctions-watch-commit
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v6
        with:
          # Acquire the writer lease before reading the current observation bundle.
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check whether the external monitor recently published
        id: route
        run: |
          if python -m src.un_external_poll recent; then
            echo 'external=true' >> "$GITHUB_OUTPUT"
            echo 'A complete external observation was already published within 35 minutes.'
          fi
      - name: UN XML and all committee indexes
        id: watch
        if: steps.route.outputs.external != 'true'
        run: python -m src.un_watch
      - name: Publish validated observations including explicit failures
        id: publish
        if: always() && (steps.watch.outcome == 'success' || steps.watch.outcome == 'failure')
        run: |
          test -f data/un/state.json
          git config user.name 'sanctions-watch[bot]'
          git config user.email 'sanctions-watch@users.noreply.github.com'
          git add data/un/ data/raw/un/ data/source_audit/ data/heartbeat/ data/dashboard/status.csv data/dashboard/un_reviews.csv
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(un): 国連の取得・検証・レビュー状態を記録'
          # Do not rebase computed status/ledger files onto unseen inputs. A
          # concurrent external push fails here; the next run starts from main.
          git push origin HEAD:main
      - name: UN detection and validation notices
        if: always() && steps.publish.outcome == 'success'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NEW_XML: ${{ steps.watch.outputs.new_xml_events }}
          NEW_NOTICES: ${{ steps.watch.outputs.new_notices }}
          NEW_UPDATES: ${{ steps.watch.outputs.new_updates }}
          NEW_PRESS_RSS: ${{ steps.watch.outputs.new_press_rss }}
          MONITOR_OUTCOME: ${{ steps.watch.outcome }}
        run: python -m src.un_watch_notify
      - name: Retain UN evidence on success or failure
        if: always() && steps.route.outputs.external != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: un-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/un/
            data/raw/un/
            data/source_audit/
            data/dashboard/un_reviews.csv
          retention-days: 90
          if-no-files-found: warn
