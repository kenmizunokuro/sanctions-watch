name: probe-un-transport

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/un_transport_probe.py
      - tests/test_un_transport_probe.py
      - .github/workflows/probe-un-transport.yml
  push:
    branches: [main]
    paths:
      - src/un_transport_probe.py
      - .github/workflows/probe-un-transport.yml

permissions:
  contents: read

# This only observes public endpoints; it never holds the financial writer lease.
concurrency:
  group: un-transport-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify transport reporting and redaction
        run: python -m unittest tests.test_un_transport_probe
      - name: Collect observations; completion does not imply healthy sources
        run: python -m src.un_transport_probe --out dist/un_transport_probe.json
      - name: Preserve transport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transport-un-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/un_transport_probe.json
          retention-days: 30
          if-no-files-found: error
